<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencatatan Pengeluaran — Sistem Pencatatan Terpadu Dua Rumah Makan</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="kepala" id="kepala"></header>
  <nav class="nav-cips" id="nav"></nav>

  <main class="utama">
    <section class="kartu">
      <h2>Pencatatan Pengeluaran</h2>
      <form id="formPengeluaran" autocomplete="off">
        <label for="tanggal">Tanggal</label>
        <input type="date" id="tanggal" required>

        <label for="cabang">Cabang</label>
        <input type="text" id="cabang" readonly>

        <label for="kategori">Kategori</label>
        <select id="kategori" required></select>

        <label for="keterangan">Keterangan</label>
        <textarea id="keterangan" placeholder="Uraian pengeluaran" required></textarea>

        <label for="nominal">Nominal (Rp)</label>
        <input type="number" id="nominal" min="1" step="1" inputmode="numeric" placeholder="Contoh: 50000" required>

        <div class="periksa">
          <input type="checkbox" id="konfirmasi">
          <label for="konfirmasi">Saya menyatakan data yang saya masukkan telah diperiksa kebenarannya oleh petugas pencatat.</label>
        </div>

        <button class="tombol" type="submit">Simpan Pengeluaran</button>
        <div class="pesan" id="pesan"></div>
      </form>
    </section>

    <section class="kartu">
      <h2>Pengeluaran Terakhir di Cabang Ini</h2>
      <div class="bungkus-tabel">
        <table>
          <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="angka">Nominal</th></tr></thead>
          <tbody id="daftar"><tr><td colspan="4" class="kosong">Memuat…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./js/util.js"></script>
  <script src="./js/staf.js"></script>
  <script>
    const sesi = wajibSesi();
    if (sesi) {
      pasangNavigasi('pengeluaran.html');
      const pesan = document.getElementById('pesan');
      document.getElementById('cabang').value = `${sesi.cabang.nama} (${sesi.cabang.kode})`;
      document.getElementById('tanggal').value = hariIni();

      async function muat() {
        const master = await api('/api/staf/master');
        document.getElementById('kategori').innerHTML = master.kategoriPengeluaran
          .map((k) => `<option value="${esc(k)}">${esc(k)}</option>`)
          .join('');
        muatRiwayat();
      }

      async function muatRiwayat() {
        try {
          const h = await api('/api/staf/riwayat?dari=' + tanggalLalu(7) + '&sampai=' + hariIni(), { token: sesi.token });
          const data = h.data.filter((d) => d.jenis === 'pengeluaran').slice(0, 20);
          document.getElementById('daftar').innerHTML = data.length
            ? data.map((p) => `
              <tr><td>${tanggalIndo(p.tanggal)}</td>
                  <td>${esc(p.rincian || '')}</td>
                  <td>${esc(p.keterangan.replace('Pengeluaran: ', ''))}</td>
                  <td class="angka">${rupiah(p.nominal)}</td></tr>`).join('')
            : '<tr><td colspan="4" class="kosong">Belum ada pengeluaran dalam 7 hari terakhir.</td></tr>';
        } catch (err) {
          document.getElementById('daftar').innerHTML = `<tr><td colspan="4" class="kosong">${esc(err.message)}</td></tr>`;
        }
      }

      document.getElementById('formPengeluaran').addEventListener('submit', async (e) => {
        e.preventDefault();
        sembunyikanPesan(pesan);
        try {
          const hasil = await api('/api/staf/pengeluaran', {
            method: 'POST',
            token: sesi.token,
            body: {
              tanggal: document.getElementById('tanggal').value,
              kategori: document.getElementById('kategori').value,
              keterangan: document.getElementById('keterangan').value,
              nominal: Number(document.getElementById('nominal').value),
              konfirmasi: document.getElementById('konfirmasi').checked
            }
          });
          tampilkanPesan(pesan, hasil.pesan, true);
          document.getElementById('konfirmasi').checked = false;
          document.getElementById('keterangan').value = '';
          document.getElementById('nominal').value = '';
          muatRiwayat();
        } catch (err) {
          tampilkanPesan(pesan, err.message, false);
        }
      });

      muat().catch((err) => tampilkanPesan(pesan, err.message, false));
    }
  </script>
</body>
</html>
